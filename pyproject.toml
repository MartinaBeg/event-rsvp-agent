[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icp-agent"
version = "0.1.0"
description = "Rule-based ICP agent that screens event RSVPs by scraping LinkedIn profiles and writing decisions back to a local .xlsx workbook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abaka AI" }]
dependencies = [
    "apify-client>=1.7.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
icp-agent = "icp_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/icp_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
